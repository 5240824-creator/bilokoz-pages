<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FET Диагностика</title>
<!-- Замена заголовков сервера: GitHub Pages не отдаёт собственные заголовки,
     поэтому запрет индексации, запрет передачи адреса страницы и запрет встраивания
     на чужие сайты продублированы здесь. -->
<meta name="robots" content="noindex, noai, noimageai">
<meta name="referrer" content="no-referrer">
<script>
(function () {
  if (window.top === window.self) return;
  try {
    if (window.top.location.origin === window.location.origin) return;
  } catch (e) {}
  document.documentElement.style.display = 'none';
})();
</script>
<style>
/* Локальные шрифты: скачаны с Google Fonts, обрезаны до используемого
   набора символов (латиница + кириллица + типографика) и сжаты в woff2.
   Внешних запросов нет — IP посетителя никуда не передаётся. */

@font-face {

  font-weight: 300;
  font-display: swap;
  src: url('/fonts/CormorantGaramond-300.woff2') format('woff2');
}

  font-style: italic;
  font-weight: 300;
  font-display: swap;
  src: url('/fonts/CormorantGaramond-300i.woff2') format('woff2');
}

@font-face {
  font-family: 'Cormorant Garamond';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('/fonts/CormorantGaramond-400.woff2') format('woff2');
}

@font-face {
  font-family: 'Cormorant Garamond';
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url('/fonts/CormorantGaramond-400i.woff2') format('woff2');
}

@font-face {
  font-family: 'Jost';
  font-style: normal;
  font-weight: 300;
  font-display: swap;
  src: url('/fonts/Jost-300.woff2') format('woff2');
}

@font-face {
  font-family: 'Jost';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('/fonts/Jost-400.woff2') format('woff2');
}

@font-face {
  font-family: 'Jost';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url('/fonts/Jost-500.woff2') format('woff2');
}

</style>
<style>
/* FET Диагностика — стили в системе bilokoz.com (global.css сайта): токены, радиусы 2–4px, капительные кнопки,
   лёгкий Cormorant в заголовках. Телефон — главный экран: крупный текст утверждений, ответы 64px, кнопки на всю ширину.
   Тёмная тема по умолчанию, светлая — [data-theme="light"] как на сайте (плюс системная светлая как запасной вариант). */
:root{
  --bg:#0c0e0d; --bg-2:#141715; --bg-3:#1c201e;
  --gold:#6cc792; --gold-2:#8ad6a9; --gold-3:#b0e6c6;
  --cream:#f3f6f4; --muted:#c9d1cc; --muted-2:#a3ada7;
  --line:rgba(108,199,146,.3); --line-2:rgba(243,246,244,.14);
  --soft-accent:linear-gradient(135deg,rgba(108,199,146,.06),rgba(108,199,146,.02));
  --ok:#7fb58a; --ok-soft:rgba(127,181,138,.14); --hi:#8fb0d4; --hi-soft:rgba(143,176,212,.14); --lo:#b9a3d8; --lo-soft:rgba(185,163,216,.14);
  --att:#f0944d; --att-soft:rgba(240,148,77,.16); --yel:#e3c65a; --yel-soft:rgba(227,198,90,.16);
  --on-chip:#0b0907;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --sans:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#ffffff; --bg-2:#f3f5f4; --bg-3:#e9ecea; --gold:#1f5c3a; --gold-2:#2a6644; --gold-3:#2f7350;
  --cream:#111413; --muted:#3a423e; --muted-2:#55605a; --line:rgba(31,92,58,.35); --line-2:rgba(17,20,19,.14);
  --soft-accent:linear-gradient(135deg,rgba(31,92,58,.06),rgba(31,92,58,.02));
  --ok:#256b3a; --ok-soft:rgba(47,122,68,.12); --hi:#285680; --hi-soft:rgba(47,95,138,.12); --lo:#5f4390; --lo-soft:rgba(109,79,154,.12);
  --att:#a5520f; --att-soft:rgba(196,102,28,.14); --yel:#7a5f08; --yel-soft:rgba(154,122,18,.14); --on-chip:#fff;
  color-scheme:light }}
:root[data-theme="light"]{
  --bg:#ffffff; --bg-2:#f3f5f4; --bg-3:#e9ecea; --gold:#1f5c3a; --gold-2:#2a6644; --gold-3:#2f7350;
  --cream:#111413; --muted:#3a423e; --muted-2:#55605a; --line:rgba(31,92,58,.35); --line-2:rgba(17,20,19,.14);
  --soft-accent:linear-gradient(135deg,rgba(31,92,58,.06),rgba(31,92,58,.02));
  --ok:#256b3a; --ok-soft:rgba(47,122,68,.12); --hi:#285680; --hi-soft:rgba(47,95,138,.12); --lo:#5f4390; --lo-soft:rgba(109,79,154,.12);
  --att:#a5520f; --att-soft:rgba(196,102,28,.14); --yel:#7a5f08; --yel-soft:rgba(154,122,18,.14); --on-chip:#fff;
  color-scheme:light }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--cream);font-family:var(--sans);font-weight:400;font-size:19px;line-height:1.6;padding-inline:16px;padding-block:0;margin:0}
.app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:22px;padding-block:14px 64px}
h1,h2,h3{font-family:var(--serif);font-weight:300;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em;color:var(--cream)}
h1{font-size:clamp(38px,9vw,56px)} h2{font-size:clamp(28px,7vw,40px)} h3{font-size:clamp(22px,5.4vw,26px)}
h1 em,h2 em{font-style:italic;color:var(--gold-2)}
p{margin:0;max-width:66ch}
b,strong{font-weight:500}
.muted{color:var(--muted)} .small{font-size:16px} .gold{color:var(--gold)}
.eyebrow{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:500;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:18px;height:1px;background:var(--gold);flex:none}
.topbar .eyebrow::before{display:none}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--gold);background:var(--gold);color:var(--bg);font:500 13px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:0 24px;min-height:52px;border-radius:2px;cursor:pointer;text-decoration:none;transition:background .3s,border-color .3s,transform .15s}
.btn:hover{background:var(--gold-2);border-color:var(--gold-2);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)} .btn.ghost:hover{color:var(--gold);border-color:var(--gold);background:transparent}
.btn:focus-visible,.ans:focus-visible,a:focus-visible,input:focus-visible,.lang button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:3px;padding:20px 20px}
.stack{display:grid;gap:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;flex:none}
.lang button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 12px var(--sans);letter-spacing:.12em;padding:9px 14px;cursor:pointer;min-height:40px}
.lang button[aria-pressed=true]{background:var(--gold);color:var(--bg)}
/* таймлайн */
.timeline{display:grid;gap:0;margin:6px 0}
.tl{display:grid;grid-template-columns:30px 1fr;gap:0 14px;position:relative}
.tl .dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font:500 13px var(--sans);color:var(--gold);background:var(--bg)}
.tl .body{padding-bottom:22px;border-left:1px solid var(--line);margin-left:-16px;padding-left:30px;transform:translateX(1px)}
.tl:last-child .body{border-left-color:transparent;padding-bottom:0}
.tl h3{font-size:24.5px;margin-bottom:4px}
/* вопросы — телефон главный */
.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;height:5px;background:var(--bg-3);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s ease}
.qnum{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.qtext{font-family:var(--serif);font-weight:400;font-size:clamp(27px,7vw,36px);line-height:1.22;min-height:3.4em;text-wrap:balance;color:var(--cream)}
.answers{display:grid;gap:10px}
.ans{appearance:none;display:grid;grid-template-columns:40px 1fr;align-items:center;gap:14px;text-align:left;background:var(--bg-2);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:14px 16px;font:300 18px/1.3 var(--sans);min-height:64px;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.ans b{font:500 15px var(--sans);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.ans:hover{border-color:var(--gold)}
.ans.sel{background:var(--soft-accent);border-color:var(--gold);transform:scale(1.01)} .ans.sel b{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.nav .btn:last-child{justify-self:end}
.saved{font-size:14.5px;color:var(--muted)}
/* отчёт */
.badge,.zc{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:2px;font:500 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.badge{white-space:normal;line-height:1.3;text-align:left}
.app>*,.card,.stack>*{min-width:0}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.hi{background:var(--hi-soft);color:var(--hi)} .badge.lo{background:var(--lo-soft);color:var(--lo)} .badge.att{background:var(--att-soft);color:var(--att)} .badge.yel{background:var(--yel-soft);color:var(--yel)}
.zc .ic{font-size:14.5px;line-height:1}
.zc.ok{background:var(--ok);color:var(--on-chip)} .zc.hi{background:var(--hi);color:var(--on-chip)} .zc.lo{background:var(--lo);color:var(--on-chip)} .zc.att{background:var(--att);color:var(--on-chip)} .zc.yel{background:var(--yel);color:var(--on-chip)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14.5px;color:var(--muted);min-width:0}
.legend .zc{white-space:normal;text-align:left;line-height:1.3;max-width:100%}
h1,h2,h3,.qtext{overflow-wrap:anywhere}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.scale-card{display:grid;gap:12px}
.scale-card .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.scale-card .score{font-family:var(--serif);font-size:40px;line-height:1;font-weight:400;color:var(--gold-2)}
.attn{border:1px solid var(--hi);background:var(--hi-soft);border-radius:3px;padding:14px 16px;display:grid;gap:6px}
.attn.lo{border-color:var(--lo);background:var(--lo-soft)} .attn.att{border-color:var(--att);background:var(--att-soft)} .attn.yel{border-color:var(--yel);background:var(--yel-soft)}
.attn .big{font:500 12px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.attn.lo .big{color:var(--lo)} .attn.att .big{color:var(--att)} .attn.yel .big{color:var(--yel)} .attn:not(.lo):not(.att):not(.yel) .big{color:var(--hi)}
.attn p.small{font-size:17.5px;line-height:1.55}
.med{font-size:14.5px;color:var(--muted-2)}
.matrix{width:100%;border-collapse:collapse;font-size:15.5px}
.matrix th,.matrix td{border:1px solid var(--line-2);padding:10px 8px;text-align:center;vertical-align:top}
.matrix th{font-weight:500;color:var(--muted);font-size:13.5px;letter-spacing:.14em;text-transform:uppercase}
.matrix td:first-child,.matrix th:first-child{text-align:left;color:var(--muted);font-size:14.5px}
.matrix .c{display:grid;gap:6px;justify-items:center} .matrix .c b{font-size:17.5px;font-weight:500;color:var(--cream);text-wrap:balance}
.matrix td.lo .c b{color:var(--lo)} .matrix td.hi .c b{color:var(--hi)}
.matrix td.hi{background:var(--hi-soft);box-shadow:inset 0 0 0 2px var(--hi)} .matrix td.lo{background:var(--lo-soft);box-shadow:inset 0 0 0 2px var(--lo)} .matrix td.ok{background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.matrix .c .n{font-variant-numeric:tabular-nums;font-size:24px;font-family:var(--serif);font-weight:400;color:var(--cream)}
.matrix .c .code{font-size:13.5px;letter-spacing:.12em;color:var(--muted-2)}
.matrix .c .marks{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:3px}
.res{width:100%;border-collapse:collapse;font-size:17px;font-variant-numeric:tabular-nums}
.res th,.res td{padding:9px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
.res th{font-weight:500;color:var(--muted);font-size:13.5px;letter-spacing:.14em;text-transform:uppercase}
.res tr:last-child td{border-bottom:0}
.res td.n{text-align:right;font-weight:500;font-size:19px}
.res td.code{font-weight:500;color:var(--muted-2);letter-spacing:.08em}
.res td.lead{font-weight:500;color:var(--gold)}
.res tr.cntl td{border-top:1px solid var(--line)}
.linechart{width:100%;height:auto;display:block}
.clinimg{display:block;width:100%;height:auto;border-radius:3px;border:1px solid var(--line);background:#fff}
details{border:1px solid var(--line);border-radius:3px;background:var(--bg-2)}
details summary{cursor:pointer;padding:16px 20px;font-weight:400;list-style:none;display:flex;justify-content:space-between;gap:10px;font-family:var(--serif);font-size:22.5px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--gold);font-size:24px;line-height:1} details[open] summary::after{content:"–"}
details .in{padding:0 20px 20px;display:grid;gap:12px}
.warnbox{border-left:2px solid var(--gold);padding:14px 18px;background:var(--soft-accent);border-radius:0 3px 3px 0}
.warnbox .big{font:500 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:6px}
label.chk{display:grid;grid-template-columns:26px 1fr;gap:14px;align-items:start;cursor:pointer;font-size:17.5px;line-height:1.5}
label.chk input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--gold)}
input[type=text],input[type=number]{width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--cream);border-radius:2px;padding:14px 14px;font:300 17px var(--sans);min-height:52px}
.field{display:grid;gap:6px}.field span{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px} .fields .field:first-child{grid-column:1/-1}
.note{font-size:17px;color:var(--muted);line-height:1.55}
.proto,.attrib{font-size:15px;color:var(--muted-2);border-top:1px solid var(--line-2);padding-top:14px;line-height:1.55}
.attrib b{color:var(--muted)}
a{color:var(--gold)}
/* телефон: всё крупнее и на всю ширину; компьютер — как есть */
@media (max-width:640px){
  body{font-size:18.5px}
  .app{gap:18px}
  .card{padding:16px 14px}
  .row .btn{width:100%}
  .nav{grid-template-columns:1fr 1fr}
  .nav .small{display:none}
  .nav .btn{width:100%;justify-self:stretch}
  .fields{grid-template-columns:1fr}
  .scale-card .head{flex-direction:column;gap:8px}
  .scale-card .score{font-size:44px}
  .lang button{padding:9px 12px}
  .res{font-size:15.5px} .res th,.res td{padding:8px 7px}
  .matrix .c b{font-size:16px}
}

/* ---- компоненты bilokoz.com ---- */
.site-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:62px;border-bottom:1px solid var(--line-2);margin-bottom:4px}
.logo{display:flex;align-items:center;min-height:44px;font-family:var(--serif);font-size:21.5px;font-weight:400;letter-spacing:.06em;color:var(--cream);text-decoration:none}
.logo span{color:var(--gold);font-style:italic;margin-left:.3em}
.nav-right{display:flex;align-items:center;gap:10px}
.back-link{display:inline-flex;align-items:center;min-height:40px;padding:0 8px;font:500 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;white-space:nowrap}
.back-link:hover{color:var(--gold)}
.back-link:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(max-width:480px){.back-link{padding:0 4px;letter-spacing:.08em}}
.theme-toggle{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:border-color .3s,color .3s}
.theme-toggle:hover{border-color:var(--gold);color:var(--gold)}
.ic-sun{display:block} .ic-moon{display:none}
:root[data-theme="light"] .ic-sun{display:none} :root[data-theme="light"] .ic-moon{display:block}
.page-hero{padding-top:36px;padding-bottom:26px;border-bottom:1px solid var(--line-2)}
.page-hero .eyebrow{font-size:13px;letter-spacing:.3em}
.page-title{font-family:var(--serif);font-size:clamp(36px,9vw,56px);font-weight:300;line-height:1.04;letter-spacing:-.02em;color:var(--cream);margin-top:10px}
.page-title em,.h2 em{font-style:italic;color:var(--gold-2)}
.page-lede{font-size:19px;color:var(--muted);line-height:1.62;max-width:74ch;margin-top:14px}
.sec{position:relative} .pad{padding-top:44px;padding-bottom:16px}
.h2{font-family:var(--serif);font-size:clamp(26px,7.4vw,36px);font-weight:300;line-height:1.12;color:var(--cream);letter-spacing:-.01em;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:4px;overflow:hidden;margin:0 0 22px}
.card.step{background:var(--bg-2);border:0;border-radius:0;padding:20px 18px}
.card-n{font-family:var(--serif);font-size:30px;color:var(--line);line-height:1;margin-bottom:10px}
.card-title{font-family:var(--serif);font-size:23.5px;font-weight:400;color:var(--cream);margin:0 0 8px}
.card.step p{font-size:16px;color:var(--muted);line-height:1.55}
.cta{margin-bottom:14px}
.not-dx{margin-top:22px;padding:14px 18px;border:1px solid var(--line-2);border-left:2px solid var(--gold);border-radius:3px;font-size:16px;color:var(--muted);line-height:1.65}
.not-dx b{color:var(--cream);font-weight:400}
.footer{border-top:1px solid var(--line-2);padding:28px 0 8px;margin-top:10px}
.frow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.footer .logo{font-size:19px}
.copy{font-size:13.5px;color:var(--muted-2)}
@media (max-width:640px){
  .site-nav{min-height:56px} .logo{font-size:19px;letter-spacing:.04em}
  .page-hero{padding-top:26px;padding-bottom:20px}
  .cards{grid-template-columns:1fr}
  .frow{flex-direction:column;align-items:flex-start;gap:6px}
}

/* ---- карта FET: компактная, вписана в экран ---- */
.matrix{table-layout:fixed;width:100%;font-size:14px}
.matrix th,.matrix td{padding:6px 5px}
.matrix th{font-size:13px;letter-spacing:.1em}
.matrix td:first-child,.matrix th:first-child{width:17%;font-size:14px;line-height:1.25;padding-left:6px}
.matrix td.hi,.matrix td.lo,.matrix td.ok{padding:8px 5px}
.matrix .c{gap:4px}
.matrix .c b{font-size:15px;line-height:1.2;text-shadow:none}
.matrix .c .n{font-size:23.5px;line-height:1}
.matrix .c .code{display:none}
.matrix .c .marks{gap:3px}
.matrix .zc{padding:3px 7px;font-size:13px;letter-spacing:.03em;white-space:normal;text-align:center;line-height:1.2}
.matrix .zc .ic{font-size:13.5px}

 rule_p:"Тест не ставит диагнозов. Он картографирует ваши ответы: как вы описали себя сегодня. Ответы могут быть неточными, результат — ориентир, а не приговор.<br><br>Пометка «полезно обсудить со специалистом» не означает, что черта плохая. Она означает выход за типичную зону, и чаще всего человек к моменту теста уже научился с этим обходиться: компенсировать, замещать, строить жизнь так, чтобы это не мешало. Выход из средних значений — это и есть «сложность» в нашем смысле, и в ту же сторону лежат одарённость и то, что называют суперспособностями. Всё решает ансамбль двенадцати черт: кому-то из нас проще, кому-то сложнее, кто-то ярче, кто-то отличается. Черта в зелёной зоне тоже не «хорошая сама по себе»: она просто не требует отдельного внимания. Сама по себе зелёная отметка обычно не повод для беспокойства; если в жизни что-то мешает, это всё равно стоит обсудить.<br><br>Тест актуализирует текущую картину темперамента — по модели автора, сочетания нейромедиаторных систем — и даёт основу для размышлений о себе. Результат рассчитан по алгоритму Трофимовой; пояснения и пометки для обсуждения — моя доработка. Короткий отчёт — без аналитического слоя. Он не является ни рекомендацией к действию, ни окончательным выводом. РЕКОМЕНДАЦИИ И ВЫВОДЫ, как и ПРОФОРИЕНТАЦИЯ И ОЦЕНКА РИСКОВ, делаются специалистом в рамках большого анализа вместе с анкетой. Решение, что с этим делать, остаётся за вами.",

 b_ok:"в балансе", b_hi:"выше типичной зоны", b_lo:"ниже типичной зоны", b_att:"рек. обсудить со спец.", b_yel:"м. б. норма · к обсужд.", lead:"ведущая черта",

 attn_p:z=>`Черта выражена ${z==="hi"?"ярче":"ниже"}, чем в типичной зоне. Это не значит, что она «не такая» или плохая: в вашем ансамбле она играет вот такую ноту, а в реальных ситуациях нота может звучать выше или ниже. Взаимосвязи черт находятся за пределами этого отчёта, но именно взаимные связи и формируют ансамбль.`,
 med:"Нейромедиаторы по модели автора: ", med2:". Положение модели, опубликованное в рецензируемых работах; тест нейрохимию не измеряет. <a href=\"#glossary\">Справочник нейромедиаторов</a>.",
 matrix_h:"Карта FET: ваши черты по функциям поведения", matrix_p:"Четыре уровня поведения, три функции. Цвет — зона вашего балла.",
 mth:["Уровень","Ориентация","Темп","Энергия"], lg_lo:"ниже средне-нормативных значений", lg_ok:"средне-нормативные значения", lg_hi:"выше средне-нормативных значений",
 clin_h:"Для специалистов и тех, кто интересуется психологией: психические расстройства в модели FET",
 clin_p1:"Как связаны темперамент и психические расстройства? Ниже — авторская таблица Ирины Трофимовой: как 28 известных расстройств, от депрессии до расстройств личности, выглядят в модели FET — какие черты уходят выше, какие ниже.<br><br>Это не умозрительная схема. STQ-77 проверен в опубликованных исследованиях с клиническими и контрольными группами: в обследованных группах — при депрессии и генерализованном тревожном расстройстве — статистически наблюдается картина, схожая с соответствующими строками таблицы, а между профилями этих групп выявлены различия. У отдельных людей профили могут отличаться. Часть строк таблицы опирается на обследованные группы, остальные — положения модели; степень подтверждения у них разная.",
 clin_p2:"<b>Как читать совпадение.</b> Похожий рисунок шкал — не похожий диагноз. Такие же особенности встречаются у людей без какого-либо расстройства: вы можете находиться в полной психологической и психиатрической норме, а ваш темперамент при этом внешне напоминать одно из описанных сочетаний — так «сангвиник» или «меланхолик» описывают склад, а не болезнь. Сходство само по себе не подтверждает ни заболевание, ни его риск, ни «скрытый диагноз».<br><br>Если какое-то сочетание привлекло ваше внимание, это повод присмотреться к конкретным ситуациям: как вы реагируете, что помогает справляться, возникают ли затруднения — и при желании обсудить это со специалистом. Значение имеет не рисунок шкал сам по себе, а ваше самочувствие, история и обстоятельства жизни. Автор модели прямо пишет, что опросник темперамента не предназначен для постановки диагнозов, и границы шкал в этом отчёте не являются диагностическими порогами.<br><br>Да, человек с диагнозом, который пройдёт тест, покажет картину, схожую с таблицей, — это и есть показатель научной верификации теста. Но это не значит, что человек, который покажет такую картину, обязательно с диагнозом. Для меня важно, чтобы вы это хорошо понимали.",
 clin_src:"Слайд Ирины Трофимовой «Psychiatric Disorders in the FET framework» (оригинал на английском, воспроизведён как есть). Жёлтое — черта ниже зоны, розовое — выше, белое — без отметки. Клинические исследования автора: Trofimova & Sulis, 2010, 2016 (депрессия), 2018 (тревожные расстройства).",
 next_h:"Что дальше", next_p:"Отчёт описал черты по одной. Консультация делает то, чего отчёт сделать не может: связывает их друг с другом, с вашим возрастом, запросом и обстоятельствами, и переводит в действия. Подробная анкета перед встречей сейчас в разработке; пока достаточно записаться.",
 btn_book:"Записаться на консультацию", btn_restart:"Пройти заново", nav_back:"← К странице FET", btn_forget:"Удалить данные теста из этого браузера", forget_ok:"Удалить ответы, анкету и отчёт из этого браузера? Запись на сервере это не удаляет: для этого напишите Дмитрию.",
 refs_h:"Ключевые работы автора модели", refs_full:"Полный список публикаций по STQ и FET →",
 attrib:"<b>Автор опросника и модели</b> — Ирина Трофимова (Compact STQ-77, модель FET). Оригинальные бланки на русском и английском размещены на <a href=\"https://psonline.ca/PS-STQ.htm\" target=\"_blank\" rel=\"noopener\">сайте автора</a>. Эта страница — веб-реализация опросника с авторским ключом и зонами авторского шаблона. Пояснения к чертам и пометки «полезно обсудить» — моя доработка и интерпретация (на правах ученика), не авторский текст. Тест бесплатен и не используется в коммерческих целях.",
 proto:"Рабочая версия от 2026-10-12 (v7.1). Расчёт выполняется на сервере; страница только показывает ваш фрагмент отчёта. Ключ: авторский ключ Compact STQ (20 обратных пунктов). Зоны: авторский Excel-шаблон STQ-77. Формулировки: текущие авторские формы RU/EN; русские тексты согласованы 12.10.2026, финальная редакция — Дмитрий. Зоны Low/Average/High — описательные ярлыки авторского шаблона, не сигнал. Слой внимания (◇ ◆) — моя методика, не часть авторского шаблона Правила слоя внимания хранятся на сервере и в тексте страницы не публикуются."

en:{
 eyebrow:"Dmitry Bilokoz · temperament in the FET model", title:"FET Assessment", title_html:"FET <em>Assessment</em>", steps_eyebrow:"How it works", steps_h:"Four steps: <em>test, report, explanations, consultation</em>",
 intro:"Irina Trofimova’s Structure of Temperament Questionnaire, STQ-77. The author distributes it free of charge, and so do we: a free test and a free report right after completion. We gave it a convenient form and added explanations.",
 steps:[["Test","77 statements, about fifteen minutes. Answer as your typical self, not your ideal self: there are no right answers."],["Report at once","A profile of twelve traits with numbers, which trait leads, what is in balance and what is worth discussing with a specialist."],["Explanations","What each trait means, which neuromediators stand behind it in the author’s model, and what clinical patterns look like in this model."],["Consultation","The report describes traits one by one. How they work together, at your age and in your circumstances, is worked out in a consultation. The detailed pre-meeting questionnaire is in development."]],
 btn_start:"Take the free test", btn_prep:"Prepare for a consultation · in development", prep_note:"The pre-consultation questionnaire is in development. To book a consultation, take the free test and press “Book” in the report: you will receive the detailed questionnaire before the meeting.",

 rules_h:"Four rules of the test",
 rules:"1. Imagine the situations most typical for you.<br>2. There are no right or wrong answers.<br>3. Do not linger on a statement longer than it takes to understand it.<br>4. Every answer is saved. If you close the page, you continue from the same place.",
 consent:"I agree to the processing of my answers to build the report. Answers and the result are stored on the server and available only to the specialist; they are not passed to third parties. <a href=\"/en/privacy\" target=\"_blank\" rel=\"noopener\">Privacy policy</a>.",
 btn_begin:"Start the test", btn_back:"Back", btn_prev:"← Back", btn_next:"Next →", btn_finish:"Calculate the result →", keys_hint:"Keys 1–4 also work",
 qn:n=>`Statement ${n} of 77`, saved:"saved", not_saved:"not saved — check your browser settings", missing:n=>`skipped: ${n}`, lang_locked:"The language of the statements is fixed for the duration of the test",
 free_report:"Free report", dis_h:"If you feel like arguing", dis_p:"This interpretation may make you want to argue, or disagree completely. That is entirely normal. It may mean that mistakes were made while answering, and it may be a good reason to discuss the situation with a psychologist: emotions, whether of agreement or disagreement, are in any case a good marker for a conversation. The test may also contain technical errors — those are worth reporting too, so they can be fixed.", gl_h:"Glossary: neuromediators in the FET model — what they do and what imbalance means", gl_intro:"In Irina Trofimova’s model every temperament trait rests on an ensemble of neuromediators, hormones and opioid receptors. These are propositions of the model published in peer-reviewed work; the STQ-77 does not measure neurochemistry, it measures behaviour. The author’s key idea: health is moderate oscillation of each system, not “much” or “little”; systems mutually amplify and dampen each other, so “imbalance” can be read only in the ensemble.", gl_src:"Sources: Trofimova & Sulis 2016 (Frontiers in Psychology, the FET model, Fig. 1); Trofimova 2021 (chapter on abilities: cycles and their maintenance); Trofimova & Araki 2022; Trofimova & Araki 2026 (opioid receptors and emotional amplifiers). The paraphrase is mine; the abbreviations are the author’s.", gl_role:"What it does", gl_bal:"Imbalance: good or bad?", btn_demo:"View a sample FREE report", demo_h:"Sample report on fictional answers", demo_p:"This is a demonstration, not your result: this is what the report looks like after completion. The profile is invented and is not saved anywhere.", demo_take:"Take your own test", demo_exit:"Back", demo_name:"sample", rev_note:"Explanations are shown in the new edition of the texts; answers and scores are unchanged.", r_title:name=>`Your temperament profile${name}`,
 r_date:d=>`Completed ${d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}. STQ-77, author’s key, zones of the author’s template.`,
 v_ok:c=>`Validity scale: ${c}, no limitation found`, v_ok_p:"Validity check passed. The control scale found none of the limitation it is designed to detect. The result still depends on the accuracy of your answers.",
  v_bad:c=>`Validity scale: ${c}. VALIDITY CHECK NOT PASSED`, v_bad_p:"This result is shown for information only. The report is not accepted for work: by the control scale the system considers a significant part of the answers unreliable. This does not prove deliberate misrepresentation: differences in understanding or an error may be involved. You can retake the test, following the instructions carefully, or complete it with a psychologist who can clarify unfamiliar wording.",

 th:["Trait","Score","Zone","Leading trait"], cntl_name:"Validity scale", cntl_en:"Validity Index", cntl_note:"if >14, the result is in question",
 rule_h:"How to read this report",
 rule_p:"The test does not diagnose. It maps your answers: how you described yourself today. Answers can be inaccurate; the result is a guide, not a verdict.<br><br>The mark “worth discussing with a specialist” does not mean a trait is bad. It means a departure from the typical zone, and by the time people take the test they have most often already learned to live with it: to compensate, to substitute, to arrange life so that it does not get in the way. A departure from the middle values is what we mean by “difficulty”, and in the same direction lie giftedness and what people call superpowers. Everything is decided by the ensemble of twelve traits: for some of us things are easier, for some harder, some are brighter, some are different. A trait in the green zone is not “good in itself” either: it simply needs no separate attention. By itself a green mark is usually no cause for concern; if something in life gets in the way, it is still worth discussing.<br><br>The test captures the current picture of your temperament — in the author’s model, the interplay of neuromediator systems — and gives you ground for reflection. The result is calculated by Trofimova’s algorithm; the explanations and discussion marks are my own elaboration. The short report has no analytical layer. It is neither a recommendation for action nor a final conclusion. RECOMMENDATIONS AND CONCLUSIONS, as well as CAREER GUIDANCE AND RISK ASSESSMENT, are made by a specialist within the full analysis together with the questionnaire. What to do with this remains your decision.",

 med:"Neuromediators in the author’s model: ", med2:". A proposition of the model published in peer-reviewed work; the test does not measure neurochemistry. <a href=\"#glossary\">Neuromediator glossary</a>.",

 mth:["Level","Orientation","Tempo","Energy"], lg_lo:"below mid-normative values", lg_ok:"mid-normative values", lg_hi:"above mid-normative values",
 clin_h:"For specialists and those interested in psychology: mental disorders in the FET model",
 clin_p1:"How are temperament and mental disorders related? Below is Irina Trofimova’s own table: what 28 known disorders, from depression to personality disorders, look like in the FET model — which traits go higher, which lower.<br><br>This is not a speculative scheme. The STQ-77 has been tested in published studies with clinical and control groups: in the examined groups — depression and generalised anxiety disorder — a picture similar to the corresponding rows of the table is observed statistically, and differences between the profiles of these groups have been found. Individual profiles may differ. Some rows of the table rest on examined groups, the rest are propositions of the model; their degree of confirmation varies.",
 clin_p2:"<b>How to read a match.</b> A similar pattern of scales is not a similar diagnosis. The same features occur in people without any disorder: you may be entirely within the psychological and psychiatric norm while your temperament outwardly resembles one of the described combinations — just as “sanguine” or “melancholic” describe a makeup, not an illness. Resemblance by itself confirms neither an illness, nor its risk, nor a “hidden diagnosis”.<br><br>If some combination has caught your attention, that is a reason to look at concrete situations: how you react, what helps you cope, whether difficulties arise — and, if you wish, to discuss it with a specialist. What matters is not the pattern of scales by itself but your wellbeing, history and circumstances. The author states explicitly that a temperament questionnaire is not meant for diagnosis, and the scale boundaries in this report are not diagnostic thresholds.<br><br>Yes, a person with a diagnosis who takes the test will show a picture similar to the table — that is precisely the mark of the test’s scientific validation. But it does not mean that a person who shows such a picture necessarily has a diagnosis. It matters to me that you understand this well.",
 clin_src:"Irina Trofimova’s slide “Psychiatric Disorders in the FET framework” (reproduced as is). Yellow: trait below the zone; pink: above; white: no mark. The author’s clinical studies: Trofimova & Sulis, 2010, 2016 (depression), 2018 (anxiety disorders).",
 next_h:"What next", next_p:"The report described the traits one by one. A consultation does what the report cannot: it links them to each other, to your age, your request and your circumstances, and turns them into actions. The detailed pre-meeting questionnaire is in development; for now, booking is enough.",

  document.querySelectorAll("[data-t]").forEach(el=>{ const k=el.dataset.t; const v=t(k); if(typeof v==="string") el.innerHTML=v; });
  $("timeline").innerHTML=t("steps").map((s,i)=>`<div class="card step"><div class="card-n">0${i+1}</div><h3 class="card-title">${s[0]}</h3><p>${s[1]}</p></div>`).join("");
  $("year").textContent=new Date().getFullYear();
  $("gl-list").innerHTML=GLOSSARY[L].map(g=>`<div class="card scale-card"><h3 style="font-size:20px">${g[0]}</h3><p class="small"><span class="eyebrow" style="display:inline-flex;margin-right:6px">${t("gl_role")}</span>${g[1]}</p><p class="small muted"><span class="eyebrow" style="display:inline-flex;margin-right:6px">${t("gl_bal")}</span>${g[2]}</p></div>`).join("");
  $("rules").innerHTML=t("rules"); $("consent-text").innerHTML=t("consent"); $("f-sex").placeholder=t("f_sex_ph");
  const REFS_HTML="<ol><li lang=\"en\">Trofimova, I. (2016). The interlocking between functional aspects of activities and a neurochemical model of adult temperament. In: Arnold, M. C. (Ed.) <i>Temperaments: Individual Differences, Social and Environmental Influences and Impact on Quality of Life</i>. Nova Science Publishers, Inc., NY, p. 77–147. ISBN: 978-1-63484-152-8.</li><li lang=\"en\">Trofimova, I. (2018). Functionality vs dimensionality in psychological taxonomies, and a puzzle of emotional valence. <i>Philosophical Transactions of the Royal Society, Biological Sciences</i>, 373 (1744). doi: <a href=\"https://doi.org/10.1098/rstb.2017.0167\" target=\"_blank\" rel=\"noopener\">10.1098/rstb.2017.0167</a></li><li lang=\"en\">Trofimova, I. (2019). An overlap between mental abilities and temperament traits. In: McFarland, D. (Ed.) <i>General and specific mental abilities</i>. Cambridge, UK: Cambridge Scholars Publishing. Pp. 176–225. ISBN-10: 1527533107, ISBN-13: 978-1-5275-3310-3.</li><li lang=\"en\">Trofimova, I. (2021a). Contingent tunes of neurochemical ensembles in the norm and pathology: can we see the patterns? <i>Neuropsychobiology</i>, 80(2), 101–133. PMID: 33721867. doi: <a href=\"https://doi.org/10.1159/000513688\" target=\"_blank\" rel=\"noopener\">10.1159/000513688</a></li><li lang=\"en\">Trofimova, I. (2021b). Functional constructivism approach to multilevel nature of biobehavioural diversity. <i>Frontiers in Psychiatry</i>, 12:641286. doi: <a href=\"https://doi.org/10.3389/fpsyt.2021.641286\" target=\"_blank\" rel=\"noopener\">10.3389/fpsyt.2021.641286</a></li><li lang=\"en\">Trofimova, I. &amp; Gaykalova, A. (2021). Emotionality vs. other biobehavioural traits: a look at neurochemical biomarkers for their differentiation. <i>Frontiers in Psychology</i>, 12:781631. doi: <a href=\"https://doi.org/10.3389/fpsyg.2021.781631\" target=\"_blank\" rel=\"noopener\">10.3389/fpsyg.2021.781631</a></li><li lang=\"en\">Trofimova, I. (2022). Transient nature of stable behavioural patterns, and how we can respect it. <i>Current Opinion in Behavioral Sciences</i>, 44. doi: <a href=\"https://doi.org/10.1016/j.cobeha.2022.101109\" target=\"_blank\" rel=\"noopener\">10.1016/j.cobeha.2022.101109</a></li><li lang=\"en\">Trofimova, I. &amp; Jahangir, S. (2026). Extraversion overrated: neurochemical complexity points to an unnecessary blend of distinct systems in one pot. <i>Frontiers in Human Neuroscience</i>, 20:2010611. doi: <a href=\"https://doi.org/10.3389/fnhum.2026.2010611\" target=\"_blank\" rel=\"noopener\">10.3389/fnhum.2026.2010611</a></li></ol>"; const refsBlock=()=>`<div class="refs"><h4>${t("refs_h")}</h4>${REFS_HTML}<p><a href="https://psonline.ca/PS-STQ.htm#reference" target="_blank" rel="noopener">${t("refs_full")}</a></p></div>`;
  $("attrib-intro").innerHTML=t("attrib")+refsBlock(); $("attrib-result").innerHTML=t("attrib")+refsBlock();
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===L ? "true":"false"));
  introState();
  if(current==="s-q") renderQ();
  if(current==="s-result") renderResult();
  if(demo && current==="s-result") $("demo-note").hidden=false;
}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{ if(current==="s-q") return; L=b.dataset.lang; st.lang=L; save(); applyStatic(); });
/* тема — как на bilokoz.com: data-theme="light" + localStorage('theme') */
(function(){ const html=document.documentElement; try{ const saved=localStorage.getItem("theme"); if(saved==="light"||saved==="dark") html.setAttribute("data-theme",saved);}catch(e){}
  $("theme-toggle").onclick=()=>{ const next = html.getAttribute("data-theme")==="light" ? "dark" : "light"; if(next==="light") html.setAttribute("data-theme","light"); else html.setAttribute("data-theme","dark"); try{ localStorage.setItem("theme",next);}catch(e){} }; })();

/* intro */
function introState(){
  const n=Object.keys(st.answers).length; const note=$("resume-note");
  if(st.done){ note.hidden=false; note.textContent=t("resume_done"); }
  else if(n>0){ note.hidden=false; note.textContent=t("resume_n")(n); }
  else note.hidden=true;
}
$("b-start").onclick=()=>{ if(st.done){renderResult();show("s-result");} else if(Object.keys(st.answers).length>0){show("s-q");renderQ();} else { show("s-consent"); } };
$("b-prep").onclick=()=>{ const n=$("prep-note"); n.hidden=!n.hidden; };
$("b-back0").onclick=()=>show("s-intro");
$("f-consent").onchange=e=>{ $("b-begin").disabled=!e.target.checked; };
$("b-begin").onclick=()=>{ st.consent=true; st.itemLang=L; st.profile={name:$("f-name").value.trim(),age:$("f-age").value,sex:$("f-sex").value.trim(),email:($("f-email-consent").checked?$("f-email").value.trim():""),email_consent:$("f-email-consent").checked&&!!$("f-email").value.trim()}; st.consent_version=CONSENT_VERSION; st.idx=0; st.telemetry.startedAt=new Date().toISOString(); meta.attempts++; if(!meta.first) meta.first=st.telemetry.startedAt; saveMeta(); ev("begin"); save(); show("s-q"); renderQ(); ensureAttempt(); };

/* questions: the item language is fixed at start (st.itemLang); UI follows L */
function renderQ(){
  const i=st.idx; const n=i+1; const il=st.itemLang||L;
  if(lastShownQ!==n){ ev("show",{q:n}); lastShownQ=n; }
  $("qn").textContent=t("qn")(n);
  $("prog").style.width=(Object.keys(st.answers).length/77*100)+"%";
  $("qtext").textContent=Q[il][i];
  const box=$("answers"); box.innerHTML="";
  LABELS[il].forEach((l,k)=>{ const v=k+1; const b=document.createElement("button"); b.type="button"; b.className="ans"+(st.answers[n]===v?" sel":""); b.innerHTML=`<b>${v}</b><span>${l}</span>`; b.onclick=()=>pick(v); box.appendChild(b); });
  $("b-prev").disabled=i===0; $("b-next").disabled=!st.answers[n];
  $("b-next").textContent = n===77 ? t("btn_finish") : t("btn_next");
  $("saved").textContent = st.answers[n] ? t("saved") : "";
}
let adv=null;
function pick(v){ const n=st.idx+1; const prev=st.answers[n]; ev("answer", prev!=null&&prev!==v ? {q:n,v,prev} : {q:n,v}); st.answers[n]=v; const ok=save(); [...$("answers").children].forEach((b,k)=>b.classList.toggle("sel",k+1===v)); $("saved").textContent= ok ? t("saved") : t("not_saved"); $("b-next").disabled=false; clearTimeout(adv); adv=setTimeout(next, 320); }
function next(){ clearTimeout(adv); if(st.idx<76){ st.idx++; save(); renderQ(); } else finish(); }
$("b-next").onclick=next;
$("b-prev").onclick=()=>{ clearTimeout(adv); if(st.idx>0){ ev("back",{from:st.idx+1}); st.idx--; save(); renderQ(); } };
document.addEventListener("keydown",e=>{ if($("s-q").hidden) return; if(["1","2","3","4"].includes(e.key)) pick(+e.key); if(e.key==="ArrowLeft") $("b-prev").click(); if(e.key==="ArrowRight"&&!$("b-next").disabled) next(); });
function finish(){
  const missing=[]; for(let i=1;i<=77;i++) if(!st.answers[i]) missing.push(i);
  if(missing.length){ st.idx=missing[0]-1; save(); renderQ(); $("saved").textContent=t("missing")(missing.length); return; }
  if(!st.done){ st.done=true; st.finishedAt=new Date().toISOString(); st.versions={copy:COPY_VERSION,key:KEY_VERSION,form:FORM_VERSION,rules:RULES_VERSION,texts:TEXT_VERSION,itemLang:st.itemLang};
    ev("finish"); meta.completions++; saveMeta(); st.telemetry.summary=summarize(st.telemetry); if(MODE!=="server") st.result=buildResult(st.answers); if(!st.review) st.review={status:"not_reviewed"}; save(); }
  if(MODE!=="server"){ st.report=localFragment(st.answers,L); save(); renderResult(); show("s-result"); return; }
  st.report=null; show("s-result"); renderResult(); finishOnServer(false).then(()=>{ if(current==="s-result") renderResult(); });
}

/* report */
function currentReport(){ return demo ? demo.report : st.report; }
function renderResult(){
  const F=currentReport();
  if(!F){ $("r-title").textContent=t("r_title")(""); $("r-date").textContent=""; const vb=$("r-validity"); vb.className="card";
    if(MODE==="server"&&st.done&&st.deleted){ vb.innerHTML=`<div class="warnbox" style="border-left-color:var(--att)"><span class="big" style="color:var(--att)">${t("deleted_h")}</span><p>${t("deleted_p")}</p></div>`; ["linechart","restable","cards","matrix","r-validity-end"].forEach(id=>$(id).innerHTML=""); $("b-prep").hidden=true; return; }
    if(MODE==="server"&&st.done){ vb.innerHTML = serverBusy ? `<p class="muted">${t("srv_wait")}</p>` : `<div class="warnbox" style="border-left-color:var(--att)"><span class="big" style="color:var(--att)">${t("srv_h")}</span><p>${t("srv_p")}</p><div class="row" style="margin-top:10px"><button class="btn primary" type="button" id="b-retry">${t("btn_retry")}</button></div></div>`; }
    else vb.innerHTML=`<div class="warnbox" style="border-left-color:var(--att)"><span class="big" style="color:var(--att)">${t("data_err_h")}</span><p>${t("incomplete_p")}</p></div>`;
    ["linechart","restable","cards","matrix","r-validity-end"].forEach(id=>$(id).innerHTML=""); $("b-prep").hidden=true; const b=$("b-retry"); if(b) b.onclick=()=>{ serverBusy=true; renderResult(); finishOnServer(false).then(()=>renderResult()); }; return; }
  if(F.lang!==L){ if(MODE==="server"){ if(demo) loadExample(); else refreshReport().then(ok=>{ if(ok&&current==="s-result") renderResult(); }); } else { if(demo) demo.report=localFragment(demo.answers,L); else st.report=localFragment(st.answers,L); return renderResult(); } }
  const Sx=k=>F.scales[k]; const ORD=F.order||ORDER; const XO=F.xls_order||XLS_ORDER;
  const name= demo ? `: ${t("demo_name")}` : (st.profile&&st.profile.name?`, ${st.profile.name}`:"");
  $("demo-note").hidden=!demo; $("b-restart").hidden=!!demo;
  $("r-title").textContent=t("r_title")(name);
  $("r-date").textContent=t("r_date")(demo?new Date():(st.finishedAt?new Date(st.finishedAt):new Date())) + ((!demo&&st.versions&&st.versions.copy!==COPY_VERSION)?" "+t("rev_note"):"");
  const band=F.cntl_band; const v= band==="valid"?"ok":band==="may_not_be_valid"?"doubt":"err"; const vb=$("r-validity"); vb.className="card";
  const dataErr = v==="err" || !(Number.isInteger(F.cntl) && F.cntl>=5 && F.cntl<=20);
  if(dataErr){ vb.innerHTML=`<div class="warnbox" style="border-left-color:var(--att)"><span class="big" style="color:var(--att)">${t("data_err_h")}</span><p>${t("data_err_p")}</p></div>`;
    ["linechart","restable","cards","matrix","r-validity-end"].forEach(id=>$(id).innerHTML=""); $("b-prep").hidden=true; return; }
  const limited = !!F.limited; /* контрольная 15–20: баллы и зоны Excel показываем, персональные пояснения, подзоны, маркеры и правила — нет; сервер их и не присылает */
  $("b-prep").hidden=limited;
  vb.innerHTML = v==="ok" ? `<p><span class="badge ok">${t("v_ok")(F.cntl)}</span></p><p class="muted small" style="margin-top:8px">${t("v_ok_p")}</p>`
    : `<div class="warnbox" style="border-left-color:var(--att)"><span class="big" style="color:var(--att)">${t("limited_h")}</span><p><b>${t("v_bad")(F.cntl)}.</b> ${t("limited_short")}</p></div>`;
  $("r-validity-end").innerHTML = limited ? `<div class="warnbox" style="border-left-color:var(--att)"><span class="big" style="color:var(--att)">${t("limited_h")}</span><p>${t("limited_short")}</p></div>` : "";
  const sc={}; ORD.forEach(k=>sc[k]=Sx(k).score); sc.CNTL=F.cntl;
  // line chart as in the author's Excel: 13 points, y 4–24
  const pts=[...XO,"CNTL"]; const W=720,H=300,Lm=40,R=12,Tm=14,B=40; const x=i=>Lm+i*(W-Lm-R)/(pts.length-1); const y=val=>Tm+(24-val)*(H-Tm-B)/20;
  let svg=`<svg class="linechart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("chart_aria")}">`;
  for(let val=4;val<=24;val+=2){ svg+=`<line x1="${Lm}" x2="${W-R}" y1="${y(val)}" y2="${y(val)}" stroke="var(--line)" stroke-width="1"/><text x="${Lm-8}" y="${y(val)+4}" font-size="13" text-anchor="end" fill="var(--muted)">${val}</text>`; }
  svg+=`<rect x="${Lm}" y="${y(18.5)}" width="${W-Lm-R}" height="${y(13.5)-y(18.5)}" fill="var(--ok)" opacity="0.10"/>`;
  svg+=`<polyline fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((k,i)=>`${x(i)},${y(sc[k])}`).join(" ")}"/>`;
  pts.forEach((k,i)=>{ const z=k==="CNTL"?"":Sx(k).zone; const col=z==="hi"?"var(--hi)":z==="lo"?"var(--lo)":k==="CNTL"?"var(--muted)":"var(--ok)";
    svg+=`<circle cx="${x(i)}" cy="${y(sc[k])}" r="5" fill="${col}" stroke="var(--bg)" stroke-width="1.5"/><text x="${x(i)}" y="${y(sc[k])-10}" font-size="14" font-weight="600" text-anchor="middle" fill="var(--fg)">${sc[k]}</text><text x="${x(i)}" y="${H-B+18}" font-size="13.5" text-anchor="middle" fill="var(--muted)">${k}</text>`; });
  svg+=`</svg>`; $("linechart").innerHTML=svg;
  // table as in Summary!D32:N44
  const tb=$("restable"); const zl={ok:"Average",hi:"High",lo:"Low"}; const vl={ok:"Valid",doubt:"May not be valid",err:"Check the value"}; const th=t("th");
  tb.innerHTML=`<tr><th></th><th>${th[0]}</th><th style="text-align:right">${th[1]}</th><th>${th[2]}</th><th>${th[3]}</th></tr>`+
    XO.map(k=>{ const q=Sx(k); const z=q.zone; const rr=q.rules||[]; return `<tr><td class="code">${k}</td><td>${q.name}<span class="small muted"> · ${q.name_other||""}</span></td><td class="n" style="color:${z==="ok"?"inherit":`var(--${z})`}">${q.score}</td><td><span class="zc ${z}"><span class="ic">${ICON[z]}</span>${zl[z]} · ${q.label}</span>${rr.map(x=>` <span class="zc ${x.level}"><span class="ic">${ICON[x.level]}</span>${t("m_"+x.level)}</span>`).join("")}</td><td class="lead">${(F.lead||[]).includes(k)?q.name:""}</td></tr>`; }).join("")+
    `<tr class="cntl"><td class="code">CNTL</td><td>${t("cntl_name")}<span class="small muted"> · ${t("cntl_en")}</span></td><td class="n">${F.cntl}</td><td><span class="badge ${v==="ok"?"ok":"lo"}">${vl[v]}</span></td><td class="small muted">${t("cntl_note")}</td></tr>`;
  // cards: outside-zone first, then attention rules inside the zone, then balanced
  const cards=$("cards"); cards.innerHTML="";
  const outside=ORD.filter(k=>Sx(k).zone!=="ok"); const ruled=ORD.filter(k=>Sx(k).zone==="ok"&&(Sx(k).rules||[]).length); const attn=[...outside,...ruled]; const balanced=ORD.filter(k=>!attn.includes(k));
  const attnCount=ORD.filter(k=>(Sx(k).rules||[]).length).length;
  const head=document.createElement("div"); head.innerHTML=`<h3>${t("cards_h")}</h3><p class="muted small" style="margin-top:6px">${limited?t("limited_cards"):t("cards_p")(outside.length, attnCount)}</p>`; cards.appendChild(head);
  (limited?ORD:[...attn,...balanced]).forEach(k=>{ const q=Sx(k); const z=q.zone; const lead_=!limited&&(F.lead||[]).includes(k); const rr=limited?[]:(q.rules||[]);
    const badge = `<span class="zc ${z}"><span class="ic">${ICON[z]}</span>${q.label}</span>`;
    if(limited){ cards.insertAdjacentHTML("beforeend",`<div class="card scale-card"><div class="head"><div><div class="eyebrow">${k}</div><h3>${q.name}</h3></div><div class="row" style="gap:8px"><span class="score">${q.score}</span>${badge}</div></div><p>${q.about}</p></div>`); return; }
    const attnBox = z==="ok"?"":`<div class="attn ${z}"><span class="big">${ICON[z]} ${t("zone_h")(z)}</span><p class="small">${q.text||""}</p><p class="small muted" style="margin-top:6px">${t("attn_p")(z)}</p></div>`;
    const ruleBox = rr.map(r=>`<div class="attn ${r.level}"><span class="big">${ICON[r.level]} ${r.level==="yel"?t("attn_h_yel"):t("attn_h")}</span><p class="small">${r.text}</p></div>`).join("");
    const ruleBadges = rr.map(r=>`<span class="zc ${r.level}"><span class="ic">${ICON[r.level]}</span>${t("b_"+r.level)}</span>`).join("");
    cards.insertAdjacentHTML("beforeend",`<div class="card scale-card"><div class="head"><div><div class="eyebrow">${k}${lead_?" · "+t("lead"):""}</div><h3>${q.name}</h3></div><div class="row" style="gap:8px"><span class="score">${q.score}</span>${badge}${ruleBadges}</div></div><p>${q.about}</p>${z==="ok"?(rr.length?"":`<p class="muted">${q.ok_text||q.text||""}</p>`):attnBox}${ruleBox}<p class="med">${t("med")}${q.med||""}${t("med2")}</p></div>`); });
  // matrix: zone colour + direction marker + attention markers
  const m=$("matrix"); const mth=t("mth"); m.innerHTML=`<tr class="hdr"><th>${mth[0]}</th><th>${mth[1]}</th><th>${mth[2]}</th><th>${mth[3]}</th></tr>`;
  const rows=MATRIX[L]; for(const r in rows){ m.insertAdjacentHTML("beforeend",`<tr><td>${r}</td>${rows[r].map((k,i)=>{ const q=Sx(k); const z=q.zone; const rr=limited?[]:(q.rules||[]);
    return `<td class="${z}"><div class="c"><span class="fn">${mth[i+1]}</span><b>${q.name}</b><span class="n">${q.score}</span><span class="marks"><span class="zc ${z}"><span class="ic">${ICON[z]}</span>${q.label}</span>${rr.map(x=>`<span class="zc ${x.level}"><span class="ic">${ICON[x.level]}</span>${t("m_"+x.level)}</span>`).join("")}</span><span class="code">${k}</span></div></td>`; }).join("")}</tr>`); }
}
function loadExample(){ if(MODE!=="server"||!API){ const a=demoAnswers(); demo={answers:a,report:localFragment(a,L)}; renderResult(); show("s-result"); return; }
  demo={report:null}; show("s-result"); serverBusy=true; renderResult();
  fetch(API+"/example?lang="+L).then(r=>r.ok?r.json():null).then(F=>{ serverBusy=false; if(F){ demo={report:F}; } renderResult(); }).catch(()=>{ serverBusy=false; renderResult(); }); }
$("b-demo").onclick=()=>loadExample();
$("demo-exit").onclick=()=>{ demo=null; show("s-intro"); };
$("demo-take").onclick=()=>{ demo=null; if(st.done){renderResult();show("s-result");} else if(Object.keys(st.answers).length>0){show("s-q");renderQ();} else show("s-consent"); };
$("b-restart").onclick=()=>{ const r=(st.telemetry&&st.telemetry.restarts||0)+1; st={answers:{},idx:0,profile:{},consent:false,done:false,lang:L,itemLang:null,telemetry:{events:[],startedAt:null,restarts:r,summary:null}}; /* новая попытка = новый талон, старый не используется */ lastShownQ=0; save(); $("f-consent").checked=false; $("b-begin").disabled=true; show("s-consent"); };

applyStatic(); show("s-intro");
if(!st.done&&Object.keys(st.answers).length>0) ev("resume",{q:st.idx+1});
if(MODE==="server"&&st.done&&!st.report&&API) finishOnServer(false).then(()=>{ if(current==="s-result") renderResult(); });
})();
</script>
